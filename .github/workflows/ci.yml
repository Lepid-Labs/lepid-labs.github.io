name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build site (clones Lepid-Labs/weft at weft.ref)
        run: scripts/build.sh
      - name: Check links
        run: node scripts/check-links.mjs _site
